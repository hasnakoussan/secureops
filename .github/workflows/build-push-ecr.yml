name: Build, Trivy Scan & Push ECR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write        # Authentification OIDC AWS
  contents: read
  security-events: write # Upload des rapports Trivy vers GitHub Security

jobs:
  build-scan-push:
    name: Build + Trivy + Push
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth
            dockerfile: services/auth/Dockerfile
            repo: secureops/auth
          - service: scan-api
            dockerfile: services/scan/Dockerfile.api
            repo: secureops/scan
          - service: worker
            dockerfile: services/scan/Dockerfile.worker
            repo: secureops/worker
          - service: dashboard
            dockerfile: services/dashboard/Dockerfile
            repo: secureops/dashboard
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Connexion AWS via OIDC
      - name: Configurer les credentials AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::265404808693:role/secureops-github-actions-role
          aws-region: us-east-1

      # 2. Login ECR
      - name: Login ECR
        uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      # 3. Préparer buildx (nécessaire pour le cache GitHub Actions)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Build de l'image Docker, avec cache GitHub Actions
      - name: Build de l'image Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: ${{ matrix.repo }}:${{ github.sha }}
          load: true
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # 5. Trivy — affichage lisible dans les logs (informatif, ne bloque jamais)
      - name: Trivy — affichage lisible
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.repo }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: 0

      # 6. Trivy — scan réel, bloquant, génère le SARIF pour GitHub Security
      - name: Trivy — scan de vulnérabilités
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.repo }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL
          exit-code: 1
          ignore-unfixed: true

      # 7. Upload du rapport Trivy vers GitHub Security
      - name: Upload résultats Trivy
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      # 8. Push vers ECR (uniquement sur main, uniquement si Trivy a validé l'image)
      - name: Tag + push vers ECR
        if: github.ref == 'refs/heads/main'
        run: |
          REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          docker tag ${{ matrix.repo }}:${{ github.sha }} $REGISTRY/${{ matrix.repo }}:${{ github.sha }}
          docker tag ${{ matrix.repo }}:${{ github.sha }} $REGISTRY/${{ matrix.repo }}:latest
          docker push $REGISTRY/${{ matrix.repo }}:${{ github.sha }}
          docker push $REGISTRY/${{ matrix.repo }}:latest
