name: Build, Trivy Scan & Push ECR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
  build-scan-push:
    name: Build + Trivy + Push
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth
            dockerfile: services/auth/Dockerfile
            repo: secureops/auth
          - service: scan-api
            dockerfile: services/scan/Dockerfile.api
            repo: secureops/scan
          - service: worker
            dockerfile: services/scan/Dockerfile.worker
            repo: secureops/worker
          - service: dashboard
            dockerfile: services/dashboard/Dockerfile
            repo: secureops/dashboard

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Étape de débogage pour afficher les réclamations OIDC
      - name: Inspecter le jeton OIDC GitHub
        run: |
          ACTIONS_ID_TOKEN_REQUEST_URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com"
          JWT=$(curl -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r '.value')
          echo "Détails du jeton OIDC :"
          echo $JWT | cut -d. -f2 | base64 -d 2>/dev/null | jq .

      # 1. Connexion AWS via OIDC
      - name: Configurer les credentials AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::156041398156:role/secureops-github-actions-role
          aws-region: us-east-1

      # 2. Login ECR
      - name: Login ECR
        uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      # 3. Build de l'image Docker
      - name: Build de l'image Docker
        run: |
          docker build -f ${{ matrix.dockerfile }} \
            -t ${{ matrix.repo }}:${{ github.sha }} .

      # 4. Scan Trivy
      - name: Trivy — scan de vulnérabilités
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.repo }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL
          exit-code: 1
          ignore-unfixed: true

      # 5. Upload du rapport Trivy
      - name: Upload résultats Trivy
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      # 6. Push vers ECR
      - name: Tag + push vers ECR
        if: github.ref == 'refs/heads/main'
        run: |
          REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          docker tag ${{ matrix.repo }}:${{ github.sha }} $REGISTRY/${{ matrix.repo }}:${{ github.sha }}
          docker tag ${{ matrix.repo }}:${{ github.sha }} $REGISTRY/${{ matrix.repo }}:latest
          docker push $REGISTRY/${{ matrix.repo }}:${{ github.sha }}
          docker push $REGISTRY/${{ matrix.repo }}:latest
