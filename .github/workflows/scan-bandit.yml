name: Bandit Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  security-events: write

jobs:
  bandit:
    name: Scan Python Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Bandit
        run: pip install bandit bandit-sarif-formatter --break-system-packages

      - name: Run Bandit
        # -r    : récursif, ciblé sur les dossiers Python uniquement (pas infra/dashboard)
        # -ll   : ne remonte que les findings de sévérité Medium ou High (ignore les Low, trop bruyants)
        # -f sarif -o : format compatible avec l'onglet Security de GitHub
        run: bandit -r services/auth services/scan -ll -f sarif -o bandit.sarif

      - name: Upload résultats vers GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: bandit.sarif
          category: bandit
