name: Checkov Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  security-events: write

jobs:
  checkov:
    name: Scan Infrastructure as Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Checkov
        run: pip install checkov --break-system-packages

      - name: Run Checkov
        run: |
          checkov -d infrastructure \
            --framework terraform \
            --compact \
            --output sarif \
            --output-file-path checkov-results
        continue-on-error: true   # temporaire : premier passage stabilisé, on retire une fois confirmé propre

      - name: Upload résultats vers GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: checkov-results/results_sarif.sarif
          category: checkov
