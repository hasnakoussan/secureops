name: Checkov Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  security-events: write

jobs:
  checkov:
    name: Scan Infrastructure as Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          framework: all
          soft_fail: true   # temporaire : premier passage, on trie les findings avant de rendre bloquant
          output_format: sarif
          output_file_path: checkov-results
        continue-on-error: true

      - name: Upload résultats vers GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: checkov-results/results_sarif.sarif
          category: checkov
