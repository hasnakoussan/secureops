name: CI - Scans de sécurité + Build & Push

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'k8s/**'
  pull_request:
    branches: [main, master]

permissions:
  id-token: write        # Authentification OIDC AWS (job build-scan-push)
  contents: read
  security-events: write # Upload des rapports SARIF vers GitHub Security

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # 1. Semgrep — analyse statique du code source
  # ============================================================
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Semgrep
        run: pip install semgrep --break-system-packages

      - name: Run Semgrep (mode CI, bloquant)
        run: semgrep ci --config p/security-audit --sarif --output semgrep.sarif

      - name: Upload résultats vers GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ============================================================
  # 2. Gitleaks — détection de secrets dans le code/historique
  # ============================================================
  gitleaks:
    name: Gitleaks Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # 3. Bandit — analyse statique spécifique Python
  # ============================================================
  bandit:
    name: Bandit Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Bandit
        run: pip install bandit bandit-sarif-formatter --break-system-packages

      - name: Run Bandit
        run: bandit -r services/auth services/scan services/falco-bridge services/notification -ll -f sarif -o bandit.sarif

      - name: Upload résultats vers GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: bandit.sarif
          category: bandit

  # ============================================================
  # 4. Checkov — misconfigurations Terraform
  # ============================================================
  checkov:
    name: Checkov Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Checkov
        run: pip install checkov --break-system-packages

      - name: Run Checkov
        run: |
          checkov -d infrastructure \
            --framework terraform \
            --compact \
            --output sarif \
            --output-file-path checkov-results

      - name: Upload résultats vers GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: checkov-results/results_sarif.sarif
          category: checkov

  # ============================================================
  # 5. Build + Trivy + Push ECR — uniquement si les 4 scans ci-dessus passent
  # ============================================================
  build-scan-push:
    name: Build + Trivy + Push
    runs-on: ubuntu-latest
    needs: [semgrep, gitleaks, bandit, checkov]
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth
            dockerfile: services/auth/Dockerfile
            repo: secureops/auth
          - service: scan-api
            dockerfile: services/scan/Dockerfile.api
            repo: secureops/scan
          - service: worker
            dockerfile: services/scan/Dockerfile.worker
            repo: secureops/worker
          - service: dashboard
            dockerfile: services/dashboard/Dockerfile
            repo: secureops/dashboard
          - service: falco-bridge
            dockerfile: services/falco-bridge/Dockerfile
            repo: secureops/falco-bridge
          - service: notification
            dockerfile: services/notification/Dockerfile
            repo: secureops/notification
    steps:
      - uses: actions/checkout@v4

      - name: Configurer les credentials AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::265404808693:role/secureops-github-actions-role
          aws-region: us-east-1

      - name: Login ECR
        uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build de l'image Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: ${{ matrix.repo }}:${{ github.sha }}
          load: true
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Trivy — affichage lisible
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.repo }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: 0
          trivyignores: .trivyignore

      - name: Trivy — scan de vulnérabilités
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.repo }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          limit-severities-for-sarif: true
          severity: CRITICAL
          exit-code: 1
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Upload résultats Trivy
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      - name: Tag + push vers ECR
        if: github.ref == 'refs/heads/main'
        run: |
          REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          docker tag ${{ matrix.repo }}:${{ github.sha }} $REGISTRY/${{ matrix.repo }}:${{ github.sha }}
          docker tag ${{ matrix.repo }}:${{ github.sha }} $REGISTRY/${{ matrix.repo }}:latest
          docker push $REGISTRY/${{ matrix.repo }}:${{ github.sha }}
          docker push $REGISTRY/${{ matrix.repo }}:latest

  # ============================================================
  # 6. Met à jour les manifests K8s avec le nouveau tag d'image
  #    (déclenche la synchro Argo CD via un vrai changement Git)
  # ============================================================
  update-manifests:
    name: Update K8s manifests
    runs-on: ubuntu-latest
    needs: build-scan-push
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mettre à jour le tag de l'image vers le commit courant
        run: |
          sed -i "s|\(secureops/auth:\).*|\1${{ github.sha }}|" k8s/auth.yaml
          sed -i "s|\(secureops/scan:\).*|\1${{ github.sha }}|" k8s/scan-api.yaml
          sed -i "s|\(secureops/worker:\).*|\1${{ github.sha }}|" k8s/worker.yaml
          sed -i "s|\(secureops/dashboard:\).*|\1${{ github.sha }}|" k8s/dashboard.yaml
          sed -i "s|\(secureops/falco-bridge:\).*|\1${{ github.sha }}|" k8s/falco-bridge.yaml
          sed -i "s|\(secureops/notification:\).*|\1${{ github.sha }}|" k8s/notification.yaml

      - name: Commit + push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/auth.yaml k8s/scan-api.yaml k8s/worker.yaml k8s/dashboard.yaml k8s/falco-bridge.yaml k8s/notification.yaml
          git diff --staged --quiet && echo "Rien à committer" && exit 0
          git commit -m "ci: déploie l'image ${{ github.sha }} [skip ci]"
          git push
