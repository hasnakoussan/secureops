name: Semgrep SAST

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Scan code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Installer Semgrep
        run: pip install semgrep --break-system-packages

      - name: Run Semgrep (mode CI, bloquant)
        run: semgrep ci --config p/security-audit --sarif --output semgrep.sarif

      - name: Upload résultats vers GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif
          category: semgrep
