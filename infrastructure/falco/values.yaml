tty: true
driver:
  kind: modern_ebpf
customRules:
  custom_rules.yaml: |
    - list: legit_k8s_api_callers
      items: [argocd-server, argocd-applicat, external-secret]

    - rule: Unexpected connection to K8s API Server from container
      desc: >
        Détecte une connexion inattendue vers l'API K8s depuis un conteneur,
        en excluant les process légitimes connus du cluster (ArgoCD, External Secrets).
      condition: >
        (evt.type=connect and evt.dir=< and fd.typechar=4)
        and (fd.rip="172.20.0.1" or fd.sip="172.20.0.1")
        and not proc.name in (legit_k8s_api_callers)
      output: >
        Unexpected connection to K8s API Server from container
        (connection=%fd.name user=%user.name process=%proc.name
        container_id=%container.id container_name=%container.name
        k8s_pod=%k8s.pod.name k8s_ns=%k8s.ns.name)
      priority: NOTICE
      tags: [network, k8s, mitre_discovery]
