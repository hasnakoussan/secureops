# docker-compose.yml — orchestre toute la stack SecureOps en local.
#
# Lancer avec : docker compose up --build

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: secureops_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_moi_plus_tard}
      POSTGRES_DB: secureops_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secureops_user -d secureops_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    # Image basée sur Debian, PAS "alpine" : la variante alpine a un bug
    # connu de permissions sur le fichier .erlang.cookie
    # ("Error when reading /var/lib/rabbitmq/.erlang.cookie: eacces"),
    # rencontré en conditions réelles pendant ce projet. La version
    # Debian n'a pas ce problème.
    image: rabbitmq:3-management
    environment:
      RABBITMQ_ERLANG_COOKIE: "secureops-dev-cookie-change-en-prod"
      RABBITMQ_DEFAULT_USER: secureops
      RABBITMQ_DEFAULT_PASS: SecureOps@2026
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 150s

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    environment:
      AUTH_DATABASE_URL: postgresql://secureops_user:${POSTGRES_PASSWORD:-change_moi_plus_tard}@postgres:5432/secureops_auth_db
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  scan-api:
    build:
      context: .
      dockerfile: services/scan/Dockerfile.api
    environment:
      DATABASE_URL: postgresql://secureops_user:${POSTGRES_PASSWORD:-change_moi_plus_tard}@postgres:5432/secureops_db
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: secureops
      RABBITMQ_PASSWORD: SecureOps@2026
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: services/scan/Dockerfile.worker
    environment:
      DATABASE_URL: postgresql://secureops_user:${POSTGRES_PASSWORD:-change_moi_plus_tard}@postgres:5432/secureops_db
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: secureops
      RABBITMQ_PASSWORD: SecureOps@2026
    volumes:
      - trivy-cache:/root/.cache/trivy
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: services/dashboard/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - auth
      - scan-api

volumes:
  postgres-data:
  trivy-cache:
  rabbitmq-data:
