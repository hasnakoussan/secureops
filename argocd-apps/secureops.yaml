apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secureops
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/hasnakoussan/secureops.git
    targetRevision: main
    path: k8s
    directory:
      recurse: true   # inclut aussi k8s/ingress/secureops-ingress.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: secureops

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
