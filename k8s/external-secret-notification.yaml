apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: notification-credentials
  namespace: secureops
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: notification-credentials
    creationPolicy: Owner
  data:
    - secretKey: SLACK_WEBHOOK_URL
      remoteRef:
        key: secureops/notification
        property: SLACK_WEBHOOK_URL
