apiVersion: v1
kind: ServiceAccount
metadata:
  name: response-sa
  namespace: secureops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: response-role
  namespace: secureops
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets", "deployments"]
    verbs: ["get"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: response-rolebinding
  namespace: secureops
subjects:
  - kind: ServiceAccount
    name: response-sa
    namespace: secureops
roleRef:
  kind: Role
  name: response-role
  apiGroup: rbac.authorization.k8s.io
