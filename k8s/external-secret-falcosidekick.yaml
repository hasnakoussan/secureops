apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: falcosidekick-webhook
  namespace: falco
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: falcosidekick-webhook-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        WEBHOOK_CUSTOMHEADERS: "X-Falco-Shared-Secret:{{ .FALCO_WEBHOOK_SECRET }}"
        WEBHOOK_ADDRESS: "http://falco-bridge.secureops.svc.cluster.local:8000/falco/webhook"
  data:
    - secretKey: FALCO_WEBHOOK_SECRET
      remoteRef:
        key: secureops/falco-bridge
        property: FALCO_WEBHOOK_SECRET
