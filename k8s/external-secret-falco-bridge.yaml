apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: falco-bridge-credentials
  namespace: secureops
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: falco-bridge-credentials
    creationPolicy: Owner
  data:
    - secretKey: FALCO_WEBHOOK_SECRET
      remoteRef:
        key: secureops/falco-bridge
        property: FALCO_WEBHOOK_SECRET
