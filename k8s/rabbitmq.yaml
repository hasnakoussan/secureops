apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: secureops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      initContainers:
        - name: render-definitions
          image: busybox:1.36
          command:
            - sh
            - -c
            - 'sed "s|__RABBITMQ_PASSWORD__|$RABBITMQ_PASSWORD|g" /template/definitions.json.template > /rendered/definitions.json'
          env:
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: RABBITMQ_PASSWORD
          volumeMounts:
            - name: rabbitmq-topology
              mountPath: /template
            - name: rendered-definitions
              mountPath: /rendered
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: management
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: rabbitmq-topology
              mountPath: /etc/rabbitmq/rabbitmq.conf
              subPath: rabbitmq.conf
            - name: rendered-definitions
              mountPath: /etc/rabbitmq/definitions.json
              subPath: definitions.json
      volumes:
        - name: rabbitmq-topology
          configMap:
            name: rabbitmq-topology
        - name: rendered-definitions
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: secureops
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
