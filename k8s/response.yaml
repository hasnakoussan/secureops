apiVersion: apps/v1
kind: Deployment
metadata:
  name: response
  namespace: secureops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: response
  template:
    metadata:
      labels:
        app: response
        secureops.io/critical-infra: "true"
    spec:
      serviceAccountName: response-sa
      containers:
        - name: response
          image: 271858453792.dkr.ecr.us-east-1.amazonaws.com/secureops/response:1d66e9c37b79bf32f1e437c7ac278c023ec42d31
          env:
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: RABBITMQ_PASSWORD
            - name: RABBITMQ_URL
              value: "amqp://secureops:$(RABBITMQ_PASSWORD)@rabbitmq:5672/"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
