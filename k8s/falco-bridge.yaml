apiVersion: apps/v1
kind: Deployment
metadata:
  name: falco-bridge
  namespace: secureops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: falco-bridge
  template:
    metadata:
      labels:
        app: falco-bridge
    spec:
      containers:
        - name: falco-bridge
          image: 265404808693.dkr.ecr.us-east-1.amazonaws.com/secureops/falco-bridge:c843448ec223a57899af3e5184436a5122cce70e
          ports:
            - containerPort: 8006
              name: http
          env:
            - name: FALCO_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: falco-bridge-credentials
                  key: FALCO_WEBHOOK_SECRET
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: RABBITMQ_PASSWORD
            - name: RABBITMQ_URL
              value: "amqp://secureops:$(RABBITMQ_PASSWORD)@rabbitmq:5672/"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8006
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: falco-bridge
  namespace: secureops
spec:
  selector:
    app: falco-bridge
  ports:
    - name: http
      port: 8000
      targetPort: 8006
